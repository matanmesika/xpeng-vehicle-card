name: XPENG dashboard v1.0.0-alpha.3 downloadable preview
on:
  push:
    branches: [feature/reference-background-parity-v012]
    paths:
      - .github/workflows/publish-dashboard-alpha3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dashboard sources, mappings, HACS package and released binary inventory
        run: |
          node --check src/xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          cmp src/xpeng-vehicle-card.js dist/xpeng-vehicle-card.js
          node --test tests/dashboard-v010.test.cjs tests/all-profiles.test.cjs
          python tests/test_hacs_package.py
          python -m json.tool model-catalog.json >/dev/null
          python -m json.tool vehicle-art-inventory.json >/dev/null
          test -s dist/assets/xpeng-reference-background.webp
          grep -Fq 'background_image' dist/xpeng-vehicle-card.js
      - name: Verify included vehicle image alpha channels
        run: |
          python -m pip install pillow
          python tools/audit_vehicle_art.py
      - name: Build HACS-ready manual installation ZIP
        run: |
          cd dist
          zip -r -q ../xpeng-dashboard-v1.0.0-alpha.3-hacs-files.zip xpeng-vehicle-card.js assets
          cd ..
          test -s xpeng-dashboard-v1.0.0-alpha.3-hacs-files.zip
          unzip -l xpeng-dashboard-v1.0.0-alpha.3-hacs-files.zip | grep -F 'vehicles/g6/2026/'
      - name: Publish clearly labeled GitHub-only experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0-alpha.3
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already released; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "XPENG Dashboard v1.0.0-alpha.3 — installable visual preview" \
            --notes-file RELEASE_NOTES_v1.0.0-alpha.3.md \
            xpeng-dashboard-v1.0.0-alpha.3-hacs-files.zip
