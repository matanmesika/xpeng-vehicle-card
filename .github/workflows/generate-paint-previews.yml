name: Generate labelled XPENG paint previews
on:
  push:
    branches:
      - feature/full-model-year-paint-artwork-map-20261012
    paths:
      - tools/recolor_vehicle_assets.py
      - .github/workflows/generate-paint-previews.yml
      - assets/vehicles/**/*.webp
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xpeng-paint-preview-generation
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'matanmesika/xpeng-vehicle-card'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-model-year-paint-artwork-map-20261012
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pillow numpy
      - name: Render only matching source model, generation, view
        run: python tools/recolor_vehicle_assets.py
      - name: Rebuild accurate image index and statuses
        run: |
          python tools/sync_vehicle_artwork.py
          python tools/export_vehicle_artwork_backlog.py
          python tools/sync_master_view_queue.py
          node tools/render_artwork_status.mjs
          python tools/sync_year_palettes.py --check
      - name: Verify images, transparency and model-year trim invariants
        run: |
          node --check src/xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          cmp src/xpeng-vehicle-card.js dist/xpeng-vehicle-card.js
          node --test tests/vehicle-artwork-mapping.test.cjs
          python tools/sync_vehicle_artwork.py --check
          python tools/export_vehicle_artwork_backlog.py --check
          python tools/sync_master_view_queue.py --check
          node tools/render_artwork_status.mjs --check
          python tools/audit_vehicle_art.py
      - name: Commit only newly derived, clearly labelled image previews
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vehicles/ sources/ai-generated-vehicle-art.json sources/derived-paint-views.json data/vehicle-art-map.json data/vehicle-art-inventory.json src/xpeng-vehicle-card.js dist/xpeng-vehicle-card.js data/artwork-backlog.csv data/master-view-queue.json data/artwork-status.json docs/ARTWORK_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'art: create transparent model-specific AI paint preview variants'
            git push origin HEAD:feature/full-model-year-paint-artwork-map-20261012
          else
            echo 'All available matched 3-view color sets already generated.'
          fi
