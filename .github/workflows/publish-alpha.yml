name: Publish XPENG alpha pre-release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-alpha.yml'

permissions:
  contents: write

jobs:
  prerelease:
    name: Validate and publish experimental pre-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify JS, catalog and HACS files
        run: |
          node --check xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          python -m json.tool hacs.json > /dev/null
          python -m json.tool model-catalog.json > /dev/null
          python tests/test_hacs_package.py
      - name: Test dashboard and charging behavior with real browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/test_rewrite_v1.py
          python -m pytest -q tests/test_brand_independence.py
      - name: Keep real desktop and iPhone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xpeng-v1-dashboard-browser-screenshots
          path: previews/rewrite-v1/*.png
          if-no-files-found: warn
      - name: Verify current version has not already been released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0-alpha.1 >/dev/null 2>&1; then
            echo 'v1.0.0-alpha.1 already exists; no changes were made.'
            exit 1
          fi
      - name: Create explicitly experimental pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0-alpha.1 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "XPENG Vehicle Card v1.0.0-alpha.1 (Alpha)" \
            --notes-file RELEASE_NOTES_v1.0.0-alpha.1.md \
            --prerelease

      - name: Attach real browser screenshots to pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.0-alpha.1 previews/rewrite-v1/*.png --repo "${GITHUB_REPOSITORY}"
