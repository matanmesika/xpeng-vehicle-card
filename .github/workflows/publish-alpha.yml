name: Publish XPENG alpha pre-release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease:
    name: Validate and publish experimental pre-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify JS, catalog and HACS files
        run: |
          node --check xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          python -m json.tool hacs.json > /dev/null
          python -m json.tool model-catalog.json > /dev/null
          python tests/test_hacs_package.py
      - name: Test dashboard and charging behavior with real browser
        run: |
          python -m pip install playwright pytest
          python -m playwright install --with-deps chromium
          python tests/visual_qa_agent.py
          python -m pytest -q tests/test_brand_independence.py
      - name: Keep real desktop and iPhone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xpeng-v010-browser-screenshots
          path: previews/visual-qa-v010/*.png
          if-no-files-found: warn
      - name: Verify current version has not already been released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already exists; no changes were made.'
            exit 1
          fi
      - name: Create explicitly experimental pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "XPENG Vehicle Card v0.1.0 (Alpha)" \
            --notes-file RELEASE_NOTES_v0.1.0.md \
            --prerelease

      - name: Attach real browser screenshots to pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0 previews/visual-qa-v010/*.png --repo "${GITHUB_REPOSITORY}"
