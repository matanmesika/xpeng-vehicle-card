name: XPENG dashboard alpha.4 with bundled approved scene
on:
  push:
    branches: [feature/hacs-bundled-approved-scene-alpha4]
    paths:
      - .github/workflows/publish-dashboard-alpha4.yml
      - tests/dashboard-v010.test.cjs
      - tests/all-profiles.test.cjs
      - tests/test_rewrite_v1.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-approved-scene-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test card JS, model profiles, HA mapping and bundled files
        run: |
          node --check xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          cmp xpeng-vehicle-card.js dist/xpeng-vehicle-card.js
          node --test tests/dashboard-v010.test.cjs tests/all-profiles.test.cjs
          python tests/test_hacs_package.py
      - name: Verify packaged image hashes and transparent foreground
        run: |
          python -m pip install pillow
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from PIL import Image
          expected={
           'xpeng-approved-lakeside-background.webp':'c0db38e9cd1c1827c53005c874af420563034258eb25444c1698d978277cf1ef',
           'vehicles/g6/2026/core_plus_rwd/arctic_white.webp':'6372377d3a04469a6c12a76942de253d96b27b1ef7619907a13d46de816a52e7',
          }
          for rel,digest in expected.items():
           a=Path('assets')/rel; b=Path('dist/assets')/rel
           assert a.read_bytes()==b.read_bytes(),rel
           assert hashlib.sha256(b.read_bytes()).hexdigest()==digest,rel
          bg=Image.open('dist/assets/xpeng-approved-lakeside-background.webp')
          assert bg.size==(1536,864)
          car=Image.open('dist/assets/vehicles/g6/2026/core_plus_rwd/arctic_white.webp')
          assert car.mode=='RGBA' and car.getchannel('A').getextrema()==(0,255)
          PY
          python tools/audit_vehicle_art.py
      - name: Render actual dashboard in desktop and mobile Chromium
        run: |
          python -m pip install playwright pytest
          python -m playwright install --with-deps chromium
          python tests/test_rewrite_v1.py
      - name: Upload screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xpeng-alpha4-real-browser-screenshots
          path: previews/dashboard-v011/*-DEMO.png
          if-no-files-found: warn
      - name: Package HACS-ready frontend with all images
        run: |
          cd dist
          zip -r -q ../xpeng-dashboard-v1.0.0-alpha.4-hacs-files.zip xpeng-vehicle-card.js assets
          cd ..
          unzip -l xpeng-dashboard-v1.0.0-alpha.4-hacs-files.zip | grep -F 'xpeng-approved-lakeside-background.webp'
          unzip -l xpeng-dashboard-v1.0.0-alpha.4-hacs-files.zip | grep -F 'vehicles/g6/2026/core_plus_rwd/arctic_white.webp'
      - name: Release alpha.4 with screenshot evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0-alpha.4
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag already exists: $TAG"
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "XPENG Dashboard v1.0.0-alpha.4 — built-in approved scene" \
            --notes-file RELEASE_NOTES_v1.0.0-alpha.4.md \
            xpeng-dashboard-v1.0.0-alpha.4-hacs-files.zip \
            previews/dashboard-v011/desktop-overview-DEMO.png \
            previews/dashboard-v011/desktop-charging-DEMO.png \
            previews/dashboard-v011/phone-overview-DEMO.png \
            previews/dashboard-v011/phone-charging-DEMO.png
