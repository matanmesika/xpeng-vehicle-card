name: G6 charging visual QA agent

on:
  push:
    branches:
      - fix/g6-charging-station-alignment-20261019
      - release/v1.0.4
      - main
    paths:
      - src/core/xpeng-vehicle-card.runtime.js
      - src/design/xpeng-vehicle-card.css
      - src/xpeng-vehicle-card.js
      - dist/xpeng-vehicle-card.js
      - scripts/capture-dashboard.cjs
      - tests/xpeng-controls-smoke.test.cjs
      - .github/workflows/g6-charging-visual-agent.yml
  pull_request:
    paths:
      - src/core/xpeng-vehicle-card.runtime.js
      - src/design/xpeng-vehicle-card.css
      - src/xpeng-vehicle-card.js
      - scripts/capture-dashboard.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g6-charging-visual-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  charging-visual-qa:
    name: Actual Chromium screenshots + charger/cable geometry
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source/dist parity and syntax
        run: |
          node --check src/xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          node --check scripts/capture-dashboard.cjs
          cmp src/xpeng-vehicle-card.js dist/xpeng-vehicle-card.js
          node tools/build_vehicle_card.mjs --check
      - name: Check charging lifecycle and real supported controls
        run: node --test tests/charging-cable-static.test.cjs tests/xpeng-controls-smoke.test.cjs tests/responsive-dual-state.test.cjs
      - name: Install real Chromium and official MDI art
        run: |
          npm install --prefix /tmp/g6-charging-qa --no-audit --no-fund playwright@1.56.1 @mdi/js@7.4.47
          /tmp/g6-charging-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate station/car/cable placement at desktop, iPhone and Sections widths
        env:
          PLAYWRIGHT_MODULE: /tmp/g6-charging-qa/node_modules/playwright
        run: timeout 180s node scripts/capture-dashboard.cjs
      - name: Keep actual dashboard preview images for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g6-charging-visual-agent-screenshots
          path: |
            docs/screenshots/charging-desktop.png
            docs/screenshots/charging-mobile.png
            docs/screenshots/home-desktop.png
            docs/screenshots/home-mobile.png
          if-no-files-found: warn
          retention-days: 30
