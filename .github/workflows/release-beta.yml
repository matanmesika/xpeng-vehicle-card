name: Publish XPENG beta pre-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Beta tag to publish
        required: true
        default: v1.0.0-beta.2
  push:
    branches: [main]
    paths:
      - '.release/v1.0.0-beta.2'

permissions:
  contents: write

jobs:
  beta:
    name: Validate and publish beta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v1.0.0-beta.2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate frontend and metadata
        shell: bash
        run: |
          set -euo pipefail
          node --check src/xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          cmp src/xpeng-vehicle-card.js dist/xpeng-vehicle-card.js
          python -m json.tool hacs.json >/dev/null
          python -m json.tool model-artwork.json >/dev/null
          python -m json.tool vehicle-art-inventory.json >/dev/null
          test -s assets/xpeng-approved-lakeside-background.webp
          test -s assets/vehicles/g6/2026/graphite_gray/front.webp
          test -s assets/vehicles/g6/2026/graphite_gray/charging.webp
          test -s assets/vehicles/g6/2026/graphite_gray/top.webp
          python - <<'PY'
          from pathlib import Path
          for name in [
              "assets/xpeng-approved-lakeside-background.webp",
              "assets/vehicles/g6/2026/graphite_gray/front.webp",
              "assets/vehicles/g6/2026/graphite_gray/charging.webp",
              "assets/vehicles/g6/2026/graphite_gray/top.webp",
          ]:
              data = Path(name).read_bytes()
              assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", name
          print("PASS: JavaScript, metadata and WebP assets validated")
          PY

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

      - name: Publish beta pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "XPENG Vehicle Card $TAG" \
            --notes-file CHANGELOG.md \
            --prerelease
