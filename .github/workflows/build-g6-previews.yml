name: Build transparent G6 previews and refresh real screenshots
on:
  push:
    branches:
      - feature/appearance-sync-and-info-v011
    paths:
      - .github/workflows/build-g6-previews.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and browser test packages
        run: |
          python -m pip install pillow numpy opencv-python-headless playwright
          python -m playwright install --with-deps chromium
      - name: Produce transparent illustrative G6 images
        run: python scripts/build_g6_cutouts.py
      - name: Render actual dashboard screenshots with clearly marked demonstration sensor values
        run: python tests/test_rewrite_v1.py
      - name: Commit actual imagery and UI screenshot gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vehicles/g6/2026/ dist/assets/vehicles/g6/2026/ previews/dashboard-v011/
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "assets: blend 2026 G6 preview images with dashboard scene and refresh captured screenshots"
            git push origin HEAD:feature/appearance-sync-and-info-v011
          fi
