name: Publish XPENG Vehicle Card v1.0.6-beta.2

on:
  push:
    branches:
      - feat/v1.0.6-beta.2-group-electrical-metrics-20261025
    paths:
      - .github/workflows/publish-v1.0.6-beta.2.yml

permissions:
  contents: write

concurrency:
  group: xpeng-v1.0.6-beta.2-release
  cancel-in-progress: false

jobs:
  publish-prerelease:
    if: github.repository == 'matanmesika/xpeng-vehicle-card' && github.ref == 'refs/heads/feat/v1.0.6-beta.2-group-electrical-metrics-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.6-beta.2 >/dev/null 2>&1; then
            echo 'Beta release already exists; refusing overwrite.'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.6-beta.2; then
            echo 'Beta tag already exists; refusing to move.'
            exit 1
          fi
      - name: Validate source, bundle and HACS metadata
        run: |
          set -euo pipefail
          node --check src/xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          node --check scripts/capture-dashboard.cjs
          cmp src/xpeng-vehicle-card.js dist/xpeng-vehicle-card.js
          node tools/build_vehicle_card.mjs --check
          python -m json.tool hacs.json >/dev/null
          grep -q 'chargingElectrical' dist/xpeng-vehicle-card.js
          grep -q 'xp-charge-electrical' dist/xpeng-vehicle-card.js
          grep -q 'grid-template-columns:repeat(6' dist/xpeng-vehicle-card.js
      - name: Run charging, connectivity and regression tests
        run: |
          set -euo pipefail
          node --test tests/g6-charging-electrical-readings-beta.test.cjs tests/g6-wifi-connection-freshness-beta.test.cjs tests/g6-new-climate-status-beta.test.cjs
          node --test tests/charging-cable-static.test.cjs tests/xpeng-controls-smoke.test.cjs tests/responsive-dual-state.test.cjs tests/g6-mobile-charging-icons.test.cjs
      - name: Install Chromium for visual QA
        run: |
          npm install --prefix /tmp/g6-v106-qa --no-audit --no-fund playwright@1.56.1 @mdi/js@7.4.47
          /tmp/g6-v106-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture and validate actual responsive card geometry
        env:
          PLAYWRIGHT_MODULE: /tmp/g6-v106-qa/node_modules/playwright
        run: timeout 180s node scripts/capture-dashboard.cjs
      - name: Upload actual desktop and iPhone screenshots
        uses: actions/upload-artifact@v4
        with:
          name: xpeng-g6-v1.0.6-beta.2-charging-screenshots
          path: |
            docs/screenshots/charging-mobile.png
            docs/screenshots/charging-desktop.png
          retention-days: 30
      - name: Publish HACS-installable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.0.6-beta.2 'dist/xpeng-vehicle-card.js#xpeng-vehicle-card.js' \
            --target "${GITHUB_SHA}" \
            --title 'XPENG Vehicle Card v1.0.6-beta.2 — Grouped Electrical Charging Metrics' \
            --notes-file docs/releases/v1.0.6-beta.2.md \
            --prerelease --latest=false
          gh release view v1.0.6-beta.2 --json tagName,isPrerelease,isDraft,targetCommitish,url,assets
