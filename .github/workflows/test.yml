name: Frontend validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JavaScript and metadata
        shell: bash
        run: |
          set -euo pipefail
          node --check src/xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          cmp src/xpeng-vehicle-card.js dist/xpeng-vehicle-card.js
          python -m json.tool hacs.json >/dev/null
          python -m json.tool model-artwork.json >/dev/null
          python -m json.tool vehicle-art-inventory.json >/dev/null
          if [ -f profiles/year-profiles.json ]; then
            python -m json.tool profiles/year-profiles.json >/dev/null
          fi

      - name: Validate current G6 WebP assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = [
              "assets/xpeng-approved-lakeside-background.webp",
              "assets/vehicles/g6/2026/core_performance_awd/front.webp",
              "assets/vehicles/g6/2026/core_performance_awd/charging.webp",
              "assets/vehicles/g6/2026/core_performance_awd/top.webp",
          ]
          for name in files:
              p = Path(name)
              assert p.is_file() and p.stat().st_size > 100, name
              data = p.read_bytes()
              assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", name
          print("PASS: current G6 artwork and approved backdrop are valid WebP files")
          PY
