name: Frontend and browser tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript and JSON
        run: |
          node --check dist/xpeng-vehicle-card.js
          node --check xpeng-vehicle-card.js
          python -m json.tool hacs.json > /dev/null
          python -m json.tool model-catalog.json > /dev/null
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pytest
          python -m playwright install --with-deps chromium
      - name: Run browser regressions
        run: |
          python tests/test_year_model_color.py
          python tests/test_g6_2026_ui.py
          python tests/test_interior_palette.py
          python tests/test_dashboard_release.py
          python tests/test_cockpit_layout.py
      - name: Upload real rendered Cockpit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xpeng-v080-single-card-browser-screenshots
          path: previews/tesla-flow-v080/*.png
          if-no-files-found: warn
      - name: Verify branding independence
        run: |
          python -m pytest -q tests/test_brand_independence.py
      - name: Check installable HACS distribution
        run: python tests/test_hacs_package.py
