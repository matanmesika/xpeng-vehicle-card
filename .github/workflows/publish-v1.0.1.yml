name: Publish v1.0.1
on:
  push:
    branches: [main]
    paths:
      - '.release/v1.0.1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release content
        run: |
          node --check src/xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          cmp src/xpeng-vehicle-card.js dist/xpeng-vehicle-card.js
          node --test tests/vehicle-artwork-mapping.test.cjs
          python tools/sync_vehicle_artwork.py --check
          python tools/sync_year_palettes.py --check
          python -m json.tool hacs.json >/dev/null
          test -s dist/xpeng-vehicle-card.js
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite'
            exit 1
          fi
          gh release create v1.0.1 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "XPENG Vehicle Card v1.0.1" --notes-file docs/releases/v1.0.1.md dist/xpeng-vehicle-card.js
