name: Publish v1.0.0-alpha.2 preview (visual review only)
on:
  push:
    branches: [feature/reference-background-parity-v012]
    paths:
      - .github/workflows/publish-preview-v1.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bundle, manifest, model-year choices and sensor mappings
        run: |
          node --check dist/xpeng-vehicle-card.js
          node --check src/xpeng-vehicle-card.js
          node --test tests/dashboard-v010.test.cjs tests/all-profiles.test.cjs
          python tests/test_hacs_package.py
          python -m json.tool vehicle-art-inventory.json >/dev/null
      - name: Install browser and alpha-validation dependencies
        run: |
          python -m pip install playwright pytest pillow
          python -m playwright install --with-deps chromium
      - name: Verify transparent model art and take real Chromium screenshots
        run: |
          python tools/audit_vehicle_art.py
          python tests/test_rewrite_v1.py
      - name: Upload screenshots as separate preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.0.0-alpha.2-actual-browser-screenshots
          path: previews/dashboard-v011/*.png
          if-no-files-found: error
      - name: Create the explicitly experimental GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0-alpha.2
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Preview tag already exists; refusing to overwrite an existing release."
            exit 1
          fi
          test -s previews/dashboard-v011/desktop-overview-DEMO.png
          test -s previews/dashboard-v011/desktop-charging-DEMO.png
          test -s previews/dashboard-v011/phone-overview-DEMO.png
          test -s previews/dashboard-v011/phone-charging-DEMO.png
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "XPENG Vehicle Card v1.0.0-alpha.2 — visual review preview" \
            --notes-file RELEASE_NOTES_v1.0.0-alpha.2.md \
            previews/dashboard-v011/desktop-overview-DEMO.png \
            previews/dashboard-v011/desktop-charging-DEMO.png \
            previews/dashboard-v011/phone-overview-DEMO.png \
            previews/dashboard-v011/phone-charging-DEMO.png \
            previews/dashboard-v011/catalogue-g6-2026-arctic_white.png \
            previews/dashboard-v011/catalogue-g9-2026-graphite_gray.png \
            previews/dashboard-v011/catalogue-x9-2026-silver_frost.png \
            previews/dashboard-v011/catalogue-p7-2020-stellar_purple.png
