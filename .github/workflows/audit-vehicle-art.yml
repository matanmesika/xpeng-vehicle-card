name: Vehicle artwork transparency audit
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Verify explicit available/pending mapping
        run: python tools/sync_vehicle_artwork.py --check
      - name: Inspect uploaded overlays for actual transparency
        run: python tools/audit_vehicle_art.py
      - name: Verify provenance of every available vehicle image
        run: python tools/audit_vehicle_provenance.py
      - name: Publish artwork mapping as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpeng-model-year-paint-artwork-map
          path: |
            data/vehicle-art-map.json
            data/vehicle-art-inventory.json
          if-no-files-found: error
