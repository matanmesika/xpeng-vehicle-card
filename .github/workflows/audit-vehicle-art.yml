name: Vehicle artwork transparency audit
on:
  push:
    branches:
      - feature/reference-background-parity-v012
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Inspect all model-year previews for transparent overlay support
        run: python tools/audit_vehicle_art.py
