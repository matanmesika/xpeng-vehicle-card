name: Vehicle artwork transparency audit
on:
  push:
    branches:
      - feature/reference-background-parity-v012
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Inspect all model-year previews for transparent overlay support
        run: python tools/audit_vehicle_art.py
      - name: Upload a few opaque reference files for asset remediation review
        uses: actions/upload-artifact@v4
        with:
          name: xpeng-artwork-opaque-samples
          path: |
            dist/assets/models/g7-arctic_white.webp
            dist/assets/models/g9-arctic_white.webp
            dist/assets/models/x9-arctic_white.webp
            dist/assets/vehicles/g9/2026/long_range_rwd/arctic_white.webp
          if-no-files-found: error
