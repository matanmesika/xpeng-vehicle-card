name: HACS validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frontend bundle and documented manual configuration
        run: |
          test -s dist/xpeng-vehicle-card.js
          grep -Fq 'Manual sensor mapping' dist/xpeng-vehicle-card.js
          grep -Fq 'Manual sensor mapping' README.md
      - uses: hacs/action@main
        with:
          category: plugin
          # The upstream images check validates the latest release, not always a PR.
          # Exact model-year artwork is checked separately by the blocking browser
          # acceptance workflow; do not claim images are released without it.
          ignore: images
