name: Publish XPENG Vehicle Card v1.0.3

on:
  push:
    branches: [main]
    paths:
      - '.release/v1.0.3'

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish immutable HACS v1.0.3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate src, dist, HACS, artwork and regression suites
        shell: bash
        run: |
          set -euo pipefail
          node --check src/xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          cmp src/xpeng-vehicle-card.js dist/xpeng-vehicle-card.js
          python -m json.tool hacs.json >/dev/null
          python -m json.tool data/model-artwork.json >/dev/null
          python tools/sync_vehicle_artwork.py --check
          python tools/export_vehicle_artwork_backlog.py --check
          python tools/sync_year_palettes.py --check
          python tools/sync_master_view_queue.py --check
          node tools/render_artwork_status.mjs --check
          python tools/check_photo_candidates.py
          python tools/audit_vehicle_provenance.py
          node --test tests/vehicle-artwork-mapping.test.cjs tests/charging-cable-static.test.cjs tests/xpeng-controls-smoke.test.cjs tests/responsive-dual-state.test.cjs
          python - <<'PY'
          from pathlib import Path
          for path in (
            'assets/vehicles/g6/interior_light_gray.webp',
            'assets/vehicles/g6/interior_dark_gray.webp',
            'assets/xpeng-approved-lakeside-background.webp',
          ):
              b=Path(path).read_bytes()
              assert len(b)>10000 and b[:4]==b'RIFF' and b[8:12]==b'WEBP',(path,len(b))
              print('PASS WebP',path,len(b))
          for path in (
            'docs/screenshots/g6-2026-location-desktop.png',
            'docs/screenshots/g6-2026-location-mobile.png',
            'docs/screenshots/g6-2026-climate-desktop.png',
            'docs/screenshots/g6-2026-climate-mobile.png',
            'docs/releases/v1.0.3.md',
            'docs/G6_DASHBOARD_GUIDE_HE.md',
          ):
              assert Path(path).stat().st_size>500,path
              print('PASS release',path)
          PY
      - name: Publish v1.0.3 tag and JavaScript release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v1.0.3 already exists; refusing overwrite"
            exit 1
          fi
          gh release create v1.0.3 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "XPENG Vehicle Card v1.0.3" \
            --notes-file docs/releases/v1.0.3.md \
            dist/xpeng-vehicle-card.js
