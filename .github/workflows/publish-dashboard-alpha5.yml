name: XPENG HACS complete-assets alpha.5 release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-dashboard-alpha5.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hacs-release:
    name: Test real HACS layout and publish self-contained dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify JS, frontend paths, model catalogue, HACS distribution
        run: |
          test ! -e xpeng-vehicle-card.js
          node --check src/xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          cmp src/xpeng-vehicle-card.js dist/xpeng-vehicle-card.js
          python tests/test_hacs_package.py
          python tests/test_hacs_install_layout.py
          node --test tests/dashboard-v010.test.cjs tests/all-profiles.test.cjs
      - name: Verify approved binary assets and illustration alpha
        run: |
          python -m pip install pillow
          python tools/audit_vehicle_art.py
      - name: Chromium desktop and iPhone frontend screenshots with real bundled paths
        run: |
          python -m pip install playwright pytest
          python -m playwright install --with-deps chromium
          python tests/test_rewrite_v1.py
      - name: Archive browser screenshots for checking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xpeng-hacs-alpha5-real-screenshots
          path: previews/dashboard-v011/*-DEMO.png
          if-no-files-found: warn
      - name: Build self-contained HACS flat dist archive
        run: |
          cd dist
          zip -q -9 ../xpeng-vehicle-card-v1.0.0-alpha.5.zip xpeng-vehicle-card.js xpeng-approved-lakeside-background.webp xpeng-asset-*
          cd ..
          test -s xpeng-vehicle-card-v1.0.0-alpha.5.zip
          unzip -l xpeng-vehicle-card-v1.0.0-alpha.5.zip | grep -F 'xpeng-approved-lakeside-background.webp'
          unzip -l xpeng-vehicle-card-v1.0.0-alpha.5.zip | grep -F 'xpeng-asset-vehicles-g6-2026-core_plus_rwd-arctic_white.webp'
      - name: Publish v1.0.0-alpha.5 (not stable)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0-alpha.5
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite existing release"
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "XPENG Dashboard v1.0.0-alpha.5 — HACS complete image delivery fix" \
            --prerelease \
            --notes-file RELEASE_NOTES_v1.0.0-alpha.5.md \
            xpeng-vehicle-card-v1.0.0-alpha.5.zip \
            previews/dashboard-v011/desktop-overview-DEMO.png \
            previews/dashboard-v011/desktop-charging-DEMO.png \
            previews/dashboard-v011/phone-overview-DEMO.png \
            previews/dashboard-v011/phone-charging-DEMO.png
