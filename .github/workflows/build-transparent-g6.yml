name: Build transparent G6 2026 cutouts for backdrop review
on:
  push:
    branches:
      - feature/reference-background-parity-v012
    paths:
      - tools/build_g6_transparent_art.py
      - .github/workflows/build-transparent-g6.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transparent-car-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matte extraction packages
        run: python -m pip install pillow numpy opencv-python-headless
      - name: Generate model-year asset cutouts without a studio rectangle
        run: python tools/build_g6_transparent_art.py
      - name: Validate final HACS art transparency
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          paths=list(Path('dist/assets/vehicles/g6/2026').glob('*/*.webp'))
          assert len(paths)==21, len(paths)
          for p in paths:
              img=Image.open(p)
              assert img.mode=='RGBA', p
              a=img.getchannel('A').getextrema()
              assert a[0]==0 and a[1]==255, (p,a)
          print('PASS:',len(paths),'transparent G6 2026 assets')
          PY
      - name: Commit updated transparent artwork to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vehicles/g6/2026 dist/assets/vehicles/g6/2026
          if git diff --cached --quiet; then
            echo "No art changes"
          else
            git commit -m "assets: replace 2026 G6 studio rectangles with alpha cutouts"
            git push origin HEAD:feature/reference-background-parity-v012
          fi
