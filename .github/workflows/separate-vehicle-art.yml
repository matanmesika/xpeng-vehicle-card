name: Separate legacy vehicle art from background
on:
  push:
    branches: [feature/reference-background-parity-v012]
    paths:
      - tools/build_transparent_vehicle_previews.py
      - .github/workflows/separate-vehicle-art.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transparent-vehicle-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch original artwork, not already-cut alpha previews
        run: git fetch --depth=1 origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy opencv-python-headless
      - name: Derive adaptive vehicle silhouette mattes by model
        run: python tools/build_transparent_vehicle_previews.py
      - name: Verify all packaged artwork has a real transparent area
        run: python tools/audit_vehicle_art.py
      - name: Commit improved alpha assets to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models dist/assets/models assets/vehicles/g9/2026 dist/assets/vehicles/g9/2026
          if git diff --cached --quiet; then
            echo 'No alpha updates'
          else
            git commit -m 'assets: rebuild original vehicle cutouts without cropped front/rear bodywork'
            git push origin HEAD:feature/reference-background-parity-v012
          fi
