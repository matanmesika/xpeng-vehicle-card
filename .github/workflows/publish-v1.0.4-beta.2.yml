name: Publish XPENG Vehicle Card v1.0.4-beta.2 (real HA test)

on:
  push:
    branches: [main]
    paths:
      - '.release/v1.0.4-beta.2'

permissions:
  contents: write

concurrency:
  group: xpeng-v1.0.4-beta.2-publish
  cancel-in-progress: false

jobs:
  beta-prerelease:
    name: Verify pinned beta and publish prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETA_TAG: v1.0.4-beta.2
      BETA_SHA: fa974facf051ec078f2a4f731bd2fad153655151
    steps:
      - name: Checkout frozen beta snapshot, not main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BETA_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify beta commit, HACS bundle and owner artwork
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BETA_SHA"
          node --check src/xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          node --check scripts/capture-dashboard.cjs
          cmp src/xpeng-vehicle-card.js dist/xpeng-vehicle-card.js
          python -m json.tool hacs.json >/dev/null
          python -m json.tool data/model-artwork.json >/dev/null
          python -m json.tool data/vehicle-art-inventory.json >/dev/null
          test -s docs/releases/v1.0.4-beta.2.md
          test -s docs/G6_BETA_LIVE_ACCEPTANCE_HE.md
          python tools/sync_vehicle_artwork.py --check
          python tools/export_vehicle_artwork_backlog.py --check
          python tools/sync_year_palettes.py --check
          python tools/sync_master_view_queue.py --check
          node tools/render_artwork_status.mjs --check
          python tools/check_photo_candidates.py
          python tools/audit_vehicle_provenance.py
          python - <<'PY'
          from pathlib import Path
          for name in [
            'assets/vehicles/g6/interior_light_gray.webp',
            'assets/vehicles/g6/interior_dark_gray.webp',
            'assets/xpeng-approved-lakeside-background.webp',
            'assets/vehicles/g6/2026/graphite_gray/charging.webp'
          ]:
            b=Path(name).read_bytes()
            assert len(b)>10000 and b[:4]==b'RIFF' and b[8:12]==b'WEBP',(name,len(b))
            print('PASS original artwork:',name)
          PY

      - name: Run every maintained frontend regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/vehicle-artwork-mapping.test.cjs \
            tests/charging-cable-static.test.cjs \
            tests/xpeng-controls-smoke.test.cjs \
            tests/responsive-dual-state.test.cjs

      - name: Install Chromium and original MDI icons for independent browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/xpeng-g6-beta-qa --no-audit --no-fund playwright@1.56.1 @mdi/js@7.4.47
          /tmp/xpeng-g6-beta-qa/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify desktop, mobile and Sections against actual card rendering (mock telemetry)
        shell: bash
        env:
          PLAYWRIGHT_MODULE: /tmp/xpeng-g6-beta-qa/node_modules/playwright
        run: |
          set -euo pipefail
          timeout 150s node scripts/capture-dashboard.cjs
          python - <<'PY'
          from pathlib import Path
          import struct
          p=Path('docs/screenshots')
          required={
            'home-desktop.png','home-mobile.png','charging-desktop.png','charging-mobile.png',
            'climate-desktop.png','climate-mobile.png','maintenance-desktop.png','maintenance-mobile.png',
            'map-desktop.png','map-mobile.png','charge-controls-mobile.png','diagnostics-mobile.png',
          }
          imgs={f.name for f in p.iterdir() if f.suffix.lower() in ('.png','.jpg','.jpeg','.webp')}
          assert imgs==required,(imgs-required,required-imgs)
          for f in p.glob('*.png'):
            data=f.read_bytes()
            assert len(data)>10000 and data[:8]==b'\x89PNG\r\n\x1a\n',f
            w,h=struct.unpack('>II',data[16:24])
            assert w>=300 and h>=620,(f.name,w,h)
          print('PASS real Chromium visual checks and 12 clean capture files')
          PY

      - name: Upload CI-only screenshots (never claim live car data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xpeng-v1.0.4-beta.2-browser-QA-demo-data
          path: docs/screenshots/*.png
          retention-days: 14
          if-no-files-found: warn

      - name: Reject duplicate release or tag and publish isolated beta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$BETA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists — refusing overwrite."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$BETA_TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists — refusing overwrite."
            exit 1
          fi
          gh release create "$BETA_TAG" dist/xpeng-vehicle-card.js \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BETA_SHA" \
            --title "XPENG Vehicle Card v1.0.4-beta.2 — real HA test beta" \
            --notes-file docs/releases/v1.0.4-beta.2.md \
            --prerelease
          gh release view "$BETA_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,tagName,targetCommitish,url \
            --jq '{tag:.tagName,prerelease:.isPrerelease,target:.targetCommitish,url:.url}'
