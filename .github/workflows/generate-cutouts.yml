name: Create transparent XPENG artwork (reviewable)
on:
  push:
    branches:
      - feature/xpeng-v0.1.0-visual-agent
    paths:
      - scripts/generate_transparent_assets.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cutouts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local-only image processing dependencies
        run: python -m pip install pillow numpy opencv-python-headless
      - name: Remove studio backgrounds from the repo's own model images
        run: python scripts/generate_transparent_assets.py
      - name: Commit generated images back to this working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cutouts
          if ! git diff --cached --quiet; then
            git commit -m "assets: generated transparent XPENG vehicle cutouts"
            git push origin HEAD:feature/xpeng-v0.1.0-visual-agent
          fi
