name: Publish XPENG dashboard UI alpha.6 (images unchanged)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dashboard-ui-alpha6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    name: Verify unmodified car assets and publish HACS prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject any edits to previously approved image files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git rev-parse --verify v1.0.0-alpha.5
          CHANGED="$(git diff --name-only v1.0.0-alpha.5 HEAD -- 'assets/**' 'dist/assets/**' 'dist/xpeng-asset-*' 'dist/xpeng-approved-lakeside-background.webp')"
          if [[ -n "$CHANGED" ]]; then
            echo "::error::Release must not modify vehicle or approved background files"
            echo "$CHANGED"
            exit 1
          fi
          echo "Confirmed: all bundled car images and approved scene unchanged since alpha.5"
      - name: Validate source and packaged frontend
        run: |
          node --check src/xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          cmp src/xpeng-vehicle-card.js dist/xpeng-vehicle-card.js
          python -m json.tool hacs.json >/dev/null
          python -m json.tool model-artwork.json >/dev/null
          python tests/test_hacs_package.py
          python tests/test_hacs_install_layout.py
          python tests/test_shape_inventory.py
          node --test tests/dashboard-v010.test.cjs tests/all-profiles.test.cjs
      - name: Validate bundled artwork transparency and license metadata
        run: |
          python -m pip install pillow
          python tools/audit_vehicle_art.py
      - name: Real Chromium desktop and phone acceptance tests
        run: |
          python -m pip install playwright pytest
          python -m playwright install --with-deps chromium
          python tests/test_rewrite_v1.py
      - name: Create self-contained HACS archive using unchanged car images
        run: |
          set -euo pipefail
          cd dist
          zip -q -9 ../xpeng-vehicle-card-v1.0.0-alpha.6.zip xpeng-vehicle-card.js xpeng-approved-lakeside-background.webp xpeng-asset-*
          cd ..
          test -s xpeng-vehicle-card-v1.0.0-alpha.6.zip
          unzip -l xpeng-vehicle-card-v1.0.0-alpha.6.zip | grep -F 'xpeng-approved-lakeside-background.webp'
          unzip -l xpeng-vehicle-card-v1.0.0-alpha.6.zip | grep -F 'xpeng-asset-vehicles-g6-2026-core_plus_rwd-arctic_white.webp'
      - name: Publish v1.0.0-alpha.6 (experimental, no new car images)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0-alpha.6
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to replace already published $TAG"
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "XPENG Dashboard v1.0.0-alpha.6 — UI fixes (vehicle images unchanged)" \
            --prerelease \
            --notes-file RELEASE_NOTES_v1.0.0-alpha.6.md \
            xpeng-vehicle-card-v1.0.0-alpha.6.zip
