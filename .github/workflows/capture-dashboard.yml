name: Capture curated XPENG dashboard gallery

on:
  push:
    branches:
      - fix/g6-mobile-sensors-charging-20261017
      - chore/g6-readme-gallery-cleanup-20261018
    paths:
      - scripts/capture-dashboard.cjs
      - src/xpeng-vehicle-card.js
      - .github/workflows/capture-dashboard.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xpeng-dashboard-gallery-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright and headless Chromium
        run: |
          npm install --prefix /tmp/xpeng-capture --no-audit --no-fund playwright@1.56.1 @mdi/js@7.4.47
          /tmp/xpeng-capture/node_modules/.bin/playwright install --with-deps chromium

      - name: Capture genuine card screenshots with DEMO sensor states
        env:
          PLAYWRIGHT_MODULE: /tmp/xpeng-capture/node_modules/playwright
        run: timeout 150s node scripts/capture-dashboard.cjs

      - name: Verify the curated screenshot gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          root=Path('docs/screenshots')
          names=[
            'home-desktop','home-mobile',
            'charging-desktop','charging-mobile',
            'climate-desktop','climate-mobile',
            'maintenance-desktop','maintenance-mobile',
            'map-desktop','map-mobile',
            'charge-controls-mobile','diagnostics-mobile'
          ]
          actual={p.name for p in root.iterdir() if p.suffix.lower() in ('.png','.jpg','.jpeg','.webp')}
          required={name+'.png' for name in names}
          assert actual == required, f'Expected only the 12 curated captures; missing={required-actual}, extra={actual-required}'
          for name in names:
              p=root/(name+'.png')
              b=p.read_bytes()
              assert b[:8] == bytes([137,80,78,71,13,10,26,10]),(p,len(b))
              w,h=struct.unpack('>II',b[16:24])
              if name.endswith('-desktop'):
                  assert w>=1100 and h>=620 and len(b)>80_000,(p,w,h,len(b))
              else:
                  assert 300<=w<=500 and h>=700 and len(b)>10_000,(p,w,h,len(b))
              print('verified',p,w,h,len(b))
          PY

      - name: Commit browser captures to the screenshot gallery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          if ! git diff --staged --quiet; then
            git commit -m "docs(g6): replace old captures with 12 current dashboard screenshots"
            # Work safely with concurrent changes to this PR branch.
            # Never force-push or discard updates made after checkout.
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Screenshots published to ${GITHUB_REF_NAME}"
                exit 0
              fi
              git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; exit 1; }
            done
            echo "::error::Could not publish updated screenshots after three safe retries"
            exit 1
          fi
