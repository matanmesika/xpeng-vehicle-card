name: Publish XPENG Vehicle Card v1.0.5-beta.3

on:
  push:
    branches:
      - beta/g6-shared-fan-bar-20261025
    paths:
      - .github/workflows/publish-v1.0.5-beta.3.yml

permissions:
  contents: write

concurrency:
  group: xpeng-v1.0.5-beta.3-release
  cancel-in-progress: false

jobs:
  publish-prerelease:
    if: github.repository == 'matanmesika/xpeng-vehicle-card' && github.ref == 'refs/heads/beta/g6-shared-fan-bar-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.5-beta.3 >/dev/null 2>&1; then
            echo 'Beta.3 release already exists; will not overwrite.'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.5-beta.3; then
            echo 'Beta.3 tag already exists; will not move.'
            exit 1
          fi
      - name: Validate HACS bundle, JavaScript and metadata
        run: |
          set -euo pipefail
          node --check src/xpeng-vehicle-card.js
          node --check dist/xpeng-vehicle-card.js
          cmp src/xpeng-vehicle-card.js dist/xpeng-vehicle-card.js
          node tools/build_vehicle_card.mjs --check
          python -m json.tool hacs.json >/dev/null
          test -s dist/xpeng-vehicle-card.js
          grep -q 'xpVehicleDataStatus' dist/xpeng-vehicle-card.js
          grep -q 'xp-charge-electrical' dist/xpeng-vehicle-card.js
          grep -q 'Shared fan bar' dist/xpeng-vehicle-card.js
      - name: Verify connection vs freshness, climate and charging regressions
        run: |
          set -euo pipefail
          node --test tests/g6-wifi-connection-freshness-beta.test.cjs tests/g6-charging-electrical-readings-beta.test.cjs tests/g6-new-climate-status-beta.test.cjs
          node --test tests/charging-cable-static.test.cjs tests/xpeng-controls-smoke.test.cjs tests/responsive-dual-state.test.cjs tests/g6-mobile-charging-icons.test.cjs
      - name: Install Chromium for actual responsive visual QA
        run: |
          npm install --prefix /tmp/g6-beta3-qa --no-audit --no-fund playwright@1.56.1 @mdi/js@7.4.47
          /tmp/g6-beta3-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify vehicle/charger geometry on desktop and phone
        env:
          PLAYWRIGHT_MODULE: /tmp/g6-beta3-qa/node_modules/playwright
        run: timeout 180s node scripts/capture-dashboard.cjs
      - name: Publish HACS-installable beta.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.0.5-beta.3 'dist/xpeng-vehicle-card.js#xpeng-vehicle-card.js' \
            --target "${GITHUB_SHA}" \
            --title 'XPENG Vehicle Card v1.0.5-beta.3 — G6 Connection & Data Freshness' \
            --notes-file docs/releases/v1.0.5-beta.3.md \
            --prerelease \
            --latest=false
          gh release view v1.0.5-beta.3 --json tagName,isPrerelease,isDraft,targetCommitish,url,assets
